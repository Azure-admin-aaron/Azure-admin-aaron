<filter id="shadow" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#0b2a66" flood-opacity=".2"/></filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b2a66" flood-opacity=".12"/></filter>
</defs>
