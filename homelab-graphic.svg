<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 32 480 460" fill="none" aria-hidden="true">
<style>
.flow{stroke:#0759e6;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:3 11;animation:flow 1.7s linear infinite}.bob{animation:bob 5s ease-in-out infinite}.led{animation:blink 3s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-28}}@keyframes bob{50%{transform:translateY(-5px)}}@keyframes blink{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.flow,.bob,.led{animation:none}}
</style>
<defs>
<radialGradient id="halo" cx="50%" cy="55%" r="50%"><stop stop-color="#e3eeff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="plat" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#e6effd"/></linearGradient>
<linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e4eefe"/></linearGradient>
<linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9e6fb"/><stop offset="1" stop-color="#c3d7f8"/></linearGradient>
<linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a9c5f3"/><stop offset="1" stop-color="#8db1ee"/></linearGradient>
<linearGradient id="hubTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f8ff8"/><stop offset="1" stop-color="#0759e6"/></linearGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b2a66" flood-opacity=".16"/></filter><filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<ellipse cx="240" cy="250" rx="235" ry="215" fill="url(#halo)"/>
<ellipse cx="240" cy="434" rx="164" ry="22" fill="#0b2a66" opacity=".13" filter="url(#blur)"/>
<polygon points="35,292 240,410 240,426 35,308" fill="#d3e2f8" stroke="#c2d5f2" stroke-width="1.2"/>
<polygon points="240,410 445,292 445,308 240,426" fill="#b4cbf1" stroke="#c2d5f2" stroke-width="1.2"/>
<polygon points="35,292 240,174 445,292 240,410" fill="url(#plat)" stroke="#c2d5f2" stroke-width="1.2"/>
<g stroke="#d6e3f7" stroke-width="1" stroke-dasharray="2 6"><path d="M69 272 274 391M103 253 308 371M172 213 377 332M206 193 411 312M69 312 274 193M103 332 308 213M172 371 377 253M206 391 411 272"/></g>
<g stroke="#a9c3ee" stroke-width="2.2" stroke-linecap="round"><path d="M240 289 130 226M240 289 350 226M240 289 130 352M240 289 350 352"/></g>
<g class="flow" fill="none"><path d="M240 289 130 226M240 289 350 226M240 289 130 352M240 289 350 352"/></g>
<!-- Local DNS: the cylinder and dotted address markers echo the Azure card's services. -->
<g filter="url(#soft)"><path d="M105 220v22a25 14 0 0 0 50 0v-22" fill="url(#leftFace)" stroke="#7fa3dc" stroke-width="1.3"/><ellipse cx="130" cy="220" rx="25" ry="14" fill="url(#topFace)" stroke="#7fa3dc" stroke-width="1.3"/><circle cx="119" cy="219" r="3" fill="#0759e6"/><circle cx="130" cy="214" r="3" fill="#4f8ff8"/><circle cx="141" cy="219" r="3" fill="#0759e6"/></g>
<!-- Reverse proxy: a small isometric routing box. -->
<g filter="url(#soft)"><polygon points="322,210 350,226 350,252 322,236" fill="url(#leftFace)" stroke="#7fa3dc" stroke-width="1.3"/><polygon points="350,226 378,210 378,236 350,252" fill="url(#rightFace)" stroke="#7fa3dc" stroke-width="1.3"/><polygon points="322,210 350,194 378,210 350,226" fill="url(#topFace)" stroke="#7fa3dc" stroke-width="1.3"/><path d="M344 208h12m-3-4 4 4-4 4" stroke="#0759e6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- Small service containers. -->
<g filter="url(#soft)"><polygon points="105,343 130,357 130,374 105,360" fill="url(#leftFace)" stroke="#7fa3dc"/><polygon points="130,357 155,343 155,360 130,374" fill="url(#rightFace)" stroke="#7fa3dc"/><polygon points="105,343 130,329 155,343 130,357" fill="url(#topFace)" stroke="#7fa3dc"/><path d="M121 341h18" stroke="#0759e6" stroke-width="2" stroke-linecap="round"/></g>
<g filter="url(#soft)"><polygon points="325,343 350,357 350,374 325,360" fill="url(#leftFace)" stroke="#7fa3dc"/><polygon points="350,357 375,343 375,360 350,374" fill="url(#rightFace)" stroke="#7fa3dc"/><polygon points="325,343 350,329 375,343 350,357" fill="url(#topFace)" stroke="#7fa3dc"/><path d="M342 339h16m-12 5h16" stroke="#0759e6" stroke-width="2" stroke-linecap="round"/></g>
<!-- The Raspberry Pi is the largest component, as in the real setup. -->
<g filter="url(#soft)"><polygon points="178,252 240,288 240,337 178,301" fill="url(#leftFace)" stroke="#7fa3dc" stroke-width="1.6"/><polygon points="240,288 302,252 302,301 240,337" fill="url(#rightFace)" stroke="#7fa3dc" stroke-width="1.6"/><polygon points="178,252 240,216 302,252 240,288" fill="url(#topFace)" stroke="#7fa3dc" stroke-width="1.6"/>
<polygon points="202,252 240,230 278,252 240,274" fill="url(#hubTop)" opacity=".93"/><path d="M226 251h28m-23-8h18m-18 16h18" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle class="led" cx="193" cy="279" r="3" fill="#22c55e"/><circle cx="203" cy="285" r="3" fill="#0759e6"/><path d="M264 302l20-12m-20 20 20-12" stroke="#e9f2ff" stroke-width="4" stroke-linecap="round"/></g>
<g class="bob"><circle cx="240" cy="133" r="32" fill="#fff" stroke="#7fa3dc" stroke-width="1.7" filter="url(#soft)"/><path d="M222 139v-12l18-13 18 13v12h-36Zm12 0v-12h12v12" stroke="#0759e6" stroke-width="2.6" stroke-linejoin="round"/><path d="M204 162q36-31 72 0" stroke="#a7c5ef" stroke-width="2" stroke-linecap="round"/></g>
<g fill="#0759e6"><circle cx="40" cy="120" r="3.5"/><circle cx="444" cy="143" r="3"/><circle cx="414" cy="402" r="2.5" opacity=".6"/></g>
</svg>
