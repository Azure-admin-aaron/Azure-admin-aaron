<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 32 480 460" fill="none" aria-hidden="true">
<style>.signal{stroke-dasharray:3 8;animation:travel 2s linear infinite}.led{animation:blink 2.8s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-22}}@keyframes blink{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.signal,.led{animation:none}}</style>
<defs>
<radialGradient id="halo"><stop stop-color="#e4efff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39745d"/><stop offset=".6" stop-color="#27634e"/><stop offset="1" stop-color="#19483a"/></linearGradient>
