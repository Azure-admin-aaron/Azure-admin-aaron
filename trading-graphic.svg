<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 32 480 460" fill="none" aria-hidden="true">
<style>.flow{stroke-dasharray:3 8;animation:travel 2s linear infinite}.stamp{animation:breath 4s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-22}}@keyframes breath{50%{opacity:.65}}@media(prefers-reduced-motion:reduce){.flow,.stamp{animation:none}}</style>
<defs>
<radialGradient id="halo"><stop stop-color="#e4efff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9f1ff"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5c99f8"/><stop offset="1" stop-color="#0759e6"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b2a66" flood-opacity=".16"/></filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b2a66" flood-opacity=".12"/></filter>
</defs>
<circle cx="240" cy="254" r="218" fill="url(#halo)"/>
<path d="M34 404h412M72 430h336" stroke="#d6e5fa" stroke-width="1.5" stroke-linecap="round"/>
<!-- Research becomes a physical paper trail rather than a second cloud diagram. -->
<g filter="url(#shadow)" transform="rotate(-9 145 236)">
<rect x="49" y="111" width="177" height="261" rx="12" fill="#cadcf7" stroke="#9bb9e8"/>
<rect x="57" y="103" width="177" height="261" rx="12" fill="#f6faff" stroke="#aac5ec"/>
<rect x="65" y="95" width="177" height="261" rx="12" fill="url(#paper)" stroke="#8fb1e5" stroke-width="1.5"/>
<rect x="65" y="95" width="177" height="41" rx="12" fill="#e7f0ff"/><path d="M65 123h177" stroke="#d4e4fb"/>
<circle cx="88" cy="115" r="7" fill="#0759e6"/><path d="M85 115h6m-3-3v6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
<text x="107" y="119" fill="#1157c5" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">RESEARCH</text>
<path d="M87 156h128m-128 11h99m-99 11h119" stroke="#a9c4e9" stroke-width="3" stroke-linecap="round"/>
<path d="M87 218h128m-128 12h86" stroke="#bed2ed" stroke-width="3" stroke-linecap="round"/>
<circle cx="100" cy="278" r="20" fill="#ecf4ff" stroke="#90b3e7"/><path d="M91 282l7-9 7 5 7-14" stroke="#0759e6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M131 264h83m-83 11h62m-62 11h77" stroke="#b7cdec" stroke-width="3" stroke-linecap="round"/>
<path d="M87 319h127" stroke="#d4e3f6" stroke-width="2" stroke-linecap="round"/>
<text x="88" y="339" fill="#7e9ecb" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">IDEA / EVIDENCE / GAPS</text>
</g>
<!-- A separate risk gate interrupts the path before an order can exist. -->
<path d="M231 239h42m76 0h19" stroke="#9fbeea" stroke-width="2" stroke-linecap="round"/>
<path class="flow" d="M231 239h42m76 0h19" stroke="#0759e6" stroke-width="2.5" stroke-linecap="round"/>
<g filter="url(#soft)"><circle cx="310" cy="239" r="49" fill="#fff" stroke="#7fa8e7" stroke-width="2"/><circle class="stamp" cx="310" cy="239" r="39" fill="#eaf2ff" stroke="#a9c6f1" stroke-width="1.5"/><path d="M310 211 330 220v21c0 13-8 22-20 29-12-7-20-16-20-29v-21l20-9Z" fill="url(#blue)"/><path d="m300 240 8 8 14-16" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g filter="url(#soft)"><rect x="271" y="297" width="78" height="28" rx="14" fill="#fff" stroke="#9dbcec"/><text x="310" y="315" fill="#1157c5" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.4">RISK CHECK</text></g>
<!-- A narrow receipt conveys the paper order and review record. -->
<g filter="url(#shadow)" transform="rotate(7 397 268)">
<path d="M367 155h68v213l-9-6-8 6-8-6-8 6-8-6-8 6-9-6-10 6V155Z" fill="url(#paper)" stroke="#91b2e6" stroke-width="1.5"/>
<path d="M367 155h68v42h-68z" fill="#e8f1ff"/><text x="401" y="181" fill="#1157c5" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.1">ORDER</text>
<path d="M379 218h45m-45 11h34m-34 11h45m-45 20h45m-45 11h30" stroke="#aac5e9" stroke-width="2.6" stroke-linecap="round"/>
<rect x="375" y="292" width="52" height="36" rx="5" fill="#e7f1ff" stroke="#8eafe2"/><text x="401" y="315" fill="#0759e6" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.1">PAPER</text>
<path d="M379 344h45" stroke="#cadbf1" stroke-width="2"/>
</g>
<path d="M270 365h93" stroke="#a9c4e9" stroke-width="2" stroke-linecap="round"/><path class="flow" d="M270 365h93" stroke="#0759e6" stroke-width="2" stroke-linecap="round"/>
<g filter="url(#soft)"><rect x="178" y="348" width="96" height="33" rx="7" fill="#fff" stroke="#a1bfe9"/><path d="M190 359h38m-38 9h61" stroke="#a1bfe9" stroke-width="2.5" stroke-linecap="round"/><circle cx="258" cy="364" r="4" fill="#22a573"/></g>
<text x="205" y="404" fill="#7097d2" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">RECORD &amp; REVIEW</text>
<circle cx="47" cy="153" r="3" fill="#0759e6"/><circle cx="445" cy="114" r="2.5" fill="#0759e6"/>
</svg>
