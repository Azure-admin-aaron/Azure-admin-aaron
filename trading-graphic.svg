<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 32 480 460" fill="none" aria-hidden="true">
<style>
.flow{stroke:#0759e6;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:3 11;animation:flow 1.8s linear infinite}.bob{animation:bob 5s ease-in-out infinite}.pulse{transform-origin:240px 285px;transform-box:view-box;animation:pulse 3s ease-out infinite}
@keyframes flow{to{stroke-dashoffset:-28}}@keyframes bob{50%{transform:translateY(-5px)}}@keyframes pulse{0%{transform:scale(.65);opacity:.55}100%{transform:scale(1.55);opacity:0}}
@media(prefers-reduced-motion:reduce){.flow,.bob,.pulse{animation:none}.pulse{opacity:0}}
</style>
<defs>
<radialGradient id="halo" cx="50%" cy="55%" r="50%"><stop stop-color="#e3eeff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="plat" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#e6effd"/></linearGradient>
<linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e4eefe"/></linearGradient>
<linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9e6fb"/><stop offset="1" stop-color="#c3d7f8"/></linearGradient>
<linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a9c5f3"/><stop offset="1" stop-color="#8db1ee"/></linearGradient>
<linearGradient id="hubTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f8ff8"/><stop offset="1" stop-color="#0759e6"/></linearGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b2a66" flood-opacity=".16"/></filter><filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<ellipse cx="240" cy="250" rx="235" ry="215" fill="url(#halo)"/>
<ellipse cx="240" cy="434" rx="164" ry="22" fill="#0b2a66" opacity=".13" filter="url(#blur)"/>
<polygon points="35,292 240,410 240,426 35,308" fill="#d3e2f8" stroke="#c2d5f2" stroke-width="1.2"/>
<polygon points="240,410 445,292 445,308 240,426" fill="#b4cbf1" stroke="#c2d5f2" stroke-width="1.2"/>
<polygon points="35,292 240,174 445,292 240,410" fill="url(#plat)" stroke="#c2d5f2" stroke-width="1.2"/>
<g stroke="#d6e3f7" stroke-width="1" stroke-dasharray="2 6"><path d="M69 272 274 391M103 253 308 371M172 213 377 332M206 193 411 312M69 312 274 193M103 332 308 213M172 371 377 253M206 391 411 272"/></g>
<g stroke="#a9c3ee" stroke-width="2.2" stroke-linecap="round"><path d="M130 241 240 287 350 241M240 287 240 362"/></g>
<g class="flow" fill="none"><path d="M130 241 240 287 350 241M240 287 240 362"/></g>
<!-- Research notes: stacked documents rather than a market-price chart. -->
<g filter="url(#soft)"><polygon points="99,228 130,246 130,272 99,254" fill="url(#leftFace)" stroke="#7fa3dc" stroke-width="1.2"/><polygon points="130,246 161,228 161,254 130,272" fill="url(#rightFace)" stroke="#7fa3dc" stroke-width="1.2"/><polygon points="99,228 130,210 161,228 130,246" fill="url(#topFace)" stroke="#7fa3dc" stroke-width="1.2"/><path d="M116 227 130 219 144 227m-24 3 10 6 10-6" stroke="#0759e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- Analysis: measured bars on a service box, with no upward-profit arrow. -->
<g filter="url(#soft)"><polygon points="319,228 350,246 350,272 319,254" fill="url(#leftFace)" stroke="#7fa3dc" stroke-width="1.2"/><polygon points="350,246 381,228 381,254 350,272" fill="url(#rightFace)" stroke="#7fa3dc" stroke-width="1.2"/><polygon points="319,228 350,210 381,228 350,246" fill="url(#topFace)" stroke="#7fa3dc" stroke-width="1.2"/><path d="M340 231v-5m8 8v-11m8 11v-8" stroke="#0759e6" stroke-width="3" stroke-linecap="round"/></g>
<!-- Brake is the central, independent approval gate. -->
<ellipse class="pulse" cx="240" cy="286" rx="54" ry="31" stroke="#0759e6" stroke-width="2"/>
<g filter="url(#soft)"><polygon points="193,278 240,305 240,336 193,309" fill="#1f63d6" stroke="#0a4fc4" stroke-width="1.5"/><polygon points="240,305 287,278 287,309 240,336" fill="#0a48b8" stroke="#0a4fc4" stroke-width="1.5"/><polygon points="193,278 240,251 287,278 240,305" fill="url(#hubTop)" stroke="#0a4fc4" stroke-width="1.5"/><path d="M240 262 258 272v16c0 10-7 16-18 21-11-5-18-11-18-21v-16l18-10Z" fill="#fff" opacity=".95" transform="translate(0 -8) scale(1 .88)"/><path d="m232 278 6 5 11-13" stroke="#0759e6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- Paper order / audit: a small ledger stays downstream of the gate. -->
<g filter="url(#soft)"><polygon points="210,356 240,373 240,393 210,376" fill="url(#leftFace)" stroke="#7fa3dc" stroke-width="1.2"/><polygon points="240,373 270,356 270,376 240,393" fill="url(#rightFace)" stroke="#7fa3dc" stroke-width="1.2"/><polygon points="210,356 240,339 270,356 240,373" fill="url(#topFace)" stroke="#7fa3dc" stroke-width="1.2"/><path d="M228 354h24m-19 7h14" stroke="#0759e6" stroke-width="2.2" stroke-linecap="round"/></g>
<!-- Human review stays visible above the system. -->
<g class="bob"><circle cx="240" cy="132" r="31" fill="#fff" stroke="#7fa3dc" stroke-width="1.7" filter="url(#soft)"/><circle cx="240" cy="124" r="7" fill="#0759e6"/><path d="M224 146c1-10 7-15 16-15s15 5 16 15" fill="#0759e6"/></g>
<path d="M240 163v73" stroke="#9fc0ed" stroke-width="2" stroke-dasharray="3 8"/>
<g fill="#0759e6"><circle cx="40" cy="120" r="3.5"/><circle cx="444" cy="143" r="3"/><circle cx="414" cy="402" r="2.5" opacity=".6"/></g>
</svg>
