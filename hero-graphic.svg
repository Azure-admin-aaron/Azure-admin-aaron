<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 32 480 460" fill="none">
<style>
.flow{stroke:#0759e6;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:3 11;animation:flow 1.6s linear infinite}
.bob{animation:bob 4.5s ease-in-out infinite}
.float{animation:float 6s ease-in-out infinite}
.pulse{transform-origin:240px 292px;transform-box:view-box;animation:pulse 2.8s ease-out infinite}
.led{animation:blink 2.4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes pulse{0%{transform:scale(.6);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.flow,.bob,.float,.pulse,.led{animation:none}.pulse{opacity:0}}
</style>
<defs>
<radialGradient id="halo" cx="50%" cy="55%" r="50%"><stop stop-color="#e3eeff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="plat" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#e6effd"/></linearGradient>
<linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#e4eefe"/></linearGradient>
<linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9e6fb"/><stop offset="1" stop-color="#c3d7f8"/></linearGradient>
<linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a9c5f3"/><stop offset="1" stop-color="#8db1ee"/></linearGradient>
<linearGradient id="hubTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f8ff8"/><stop offset="1" stop-color="#0759e6"/></linearGradient>
<linearGradient id="cylSide" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dbe7fc"/><stop offset=".6" stop-color="#bcd3f8"/><stop offset="1" stop-color="#95b8ef"/></linearGradient>
<linearGradient id="cloudFill" x1="0" y1="0" x2="0.4" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#d7e6ff"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0759e6" stop-opacity="0"/><stop offset="1" stop-color="#0759e6" stop-opacity=".55"/></linearGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b2a66" flood-opacity=".16"/></filter>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
